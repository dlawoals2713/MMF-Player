plugins {
	id 'com.android.application'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
	localPropertiesFile.withReader('UTF-8') { reader ->
		localProperties.load(reader)
	}
}

def gprUser = localProperties.getProperty('gprUser') ?: System.getenv('GPR_USER')
def gprToken = localProperties.getProperty('gprToken') ?: System.getenv('GPR_TOKEN')
def ghRepos = ['oneui-design', 'sesl-androidx', 'sesl-material-components-android']

repositories {
	flatDir { dirs 'libs' }

	ghRepos.each { repoName ->
		maven {
			url = "https://maven.pkg.github.com/tribalfs/${repoName}"
			if (gprUser && gprToken) {
				credentials {
					username = gprUser
					password = gprToken
				}
			}
		}
	}
}

android {
	compileSdk 35
	
	useLibrary 'org.apache.http.legacy'
	
	defaultConfig {
		applicationId "com.dlawoals2713.yamaha"
		namespace "com.dlawoals2713.yamaha"
		minSdkVersion 23
		targetSdkVersion 34
		versionCode 1
		versionName "1.8"
	}
	
	buildTypes {
		release {
			minifyEnabled = true
			shrinkResources = true

			debuggable = false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
	}

	splits {
		abi {
			enable = true
			reset()
			include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
			universalApk = true
		}
	}

	buildFeatures {
		buildConfig = true
		viewBinding = true
	}
}

dependencies {
	implementation fileTree(dir: 'libs', include: ['*.jar'])
	implementation "androidx.activity:activity-ktx:1.9.3"
	implementation 'androidx.appcompat:appcompat:1.7.1'
	implementation "com.google.android.material:material:1.12.0"
	implementation "io.github.tribalfs:oneui-design:0.7.12+oneui7"
	implementation "io.github.oneuiproject:icons:1.1.0"
	implementation "androidx.media:media:1.8.0"
	implementation "sesl.androidx.appcompat:appcompat:1.7.1+1.0.47000-sesl7+rev2"
	implementation "sesl.androidx.core:core:1.16.0+1.0.16-sesl7+rev2"
	implementation "sesl.androidx.fragment:fragment:1.8.8+1.0.9-sesl7+rev0"
	implementation "sesl.com.google.android.material:material:1.12.0+1.0.39-sesl7+rev7"
	implementation 'com.google.android.material:material:1.14.0'
}

configurations.implementation {
	exclude (group:"androidx.core",  module:"core")
	exclude (group:"androidx.core",  module:"core-ktx")
	exclude (group:"androidx.customview",  module:"customview")
	exclude (group:"androidx.coordinatorlayout",  module:"coordinatorlayout")
	exclude (group:"androidx.drawerlayout",  module:"drawerlayout")
	exclude (group:"androidx.viewpager2",  module:"viewpager2")
	exclude (group:"androidx.viewpager",  module:"viewpager")
	exclude (group:"androidx.appcompat", module:"appcompat")
	exclude (group:"androidx.fragment", module:"fragment")
	exclude (group:"androidx.preference",  module:"preference")
	exclude (group:"androidx.recyclerview", module:"recyclerview")
	exclude (group:"androidx.slidingpanelayout",  module:"slidingpanelayout")
	exclude (group:"androidx.swiperefreshlayout",  module:"swiperefreshlayout")
	exclude (group:"com.google.android.material", module: "material")
}